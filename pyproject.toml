[project]
name = "h3-audiofirst-x2-stream"
version = "0.3.1"
description = "MiniMax H3 for ComfyUI: a 14 s 1088x1920 video with audio in 99.8 s on an RTX 4070 12GB (speed mode). The audio is generated first and locked, which also reduces the metallic voice of fast settings."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/sepiablue-ai/ComfyUI-H3-AudioFirst-X2-Stream"
Documentation = "https://github.com/sepiablue-ai/ComfyUI-H3-AudioFirst-X2-Stream#readme"
"Bug Tracker" = "https://github.com/sepiablue-ai/ComfyUI-H3-AudioFirst-X2-Stream/issues"

[tool.comfy]
PublisherId = "sepiablue-ai"
DisplayName = "H3 AudioFirst X2 Stream"
requires-comfyui = ">=0.38.0"
# Use the Python belonging to ComfyUI. CUDA/PyTorch are supplied by ComfyUI.
# This package has no extra Python dependencies.
# X2 Stream supplies av and comfy-kitchen through its own requirements.
